name: CI Build and Release

on:
  push:
    branches: [ main ]
  # Every PR, including ones stacked on another PR's branch: a stacked PR's
  # base is not main, and filtering on main left those PRs without tests.
  # Publishing jobs stay gated on a push to main.
  pull_request:
    branches: [ "**" ]

# A new push to a PR cancels that PR's superseded run, so stale runs stop
# holding runners (the org shares 20 concurrent jobs). Pushes to main each get
# their own group and are never cancelled: they publish canaries.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # HQ-61: a high or critical advisory in a production dependency of the
  # published packages or the website fails CI. Triage: CONTRIBUTING.md.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Audit workspace packages
        run: pnpm audit --prod --audit-level high
      # Fails on any high or critical advisory except those in
      # website-next/audit-allowlist.json, each of which expires on its reviewBy date.
      - name: Test audit allowlist logic
        run: node --test scripts/utils/npm-audit-allowlist.test.mjs
      - name: Audit website
        run: node scripts/audit-website.mjs

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website-next/package-lock.json
      - run: npm ci
      - name: Check telemetry contract and endpoint
        run: npm test
      - name: Build website
        run: npm run build
        env:
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_local_build_placeholder

  build:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: hypequery_test
          CLICKHOUSE_DB: test_db
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify npm package metadata
        run: pnpm check:package-metadata
      - name: Clean existing build artifacts
        run: |
          rm -rf packages/clickhouse/dist
          find packages -name '*.tsbuildinfo' -delete
      - name: Run lint
        run: pnpm lint
      - name: Build all hypequery packages
        run: pnpm turbo run build --filter='@hypequery/*'
      # Fails when the public types of protocol, datasets or deployment change
      # without an updated packages/<pkg>/api-report/*.api.md. Fix locally with
      # `pnpm api:report`; see CLAUDE.md ("Public API reports").
      - name: Check public API reports
        run: pnpm api:check
      - name: Verify bin.js file exists
        run: |
          if [ -f "packages/clickhouse/dist/cli/bin.js" ]; then
            echo "✅ bin.js exists"
            ls -la packages/clickhouse/dist/cli/bin.js
            head -n 1 packages/clickhouse/dist/cli/bin.js
          else
            echo "❌ bin.js does not exist!"
            ls -la packages/clickhouse/dist/cli/
            exit 1
          fi
      - name: Run unit tests
        run: pnpm test
      - name: Setup uv for Python conformance
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      # Install the Python environment before the conformance runner starts
      # timing cases. `uv run` would otherwise resolve and download it lazily
      # inside the per-case timeout, which races on a cold uv cache.
      - name: Sync the Python conformance environment
        run: uv sync --project python/hypequery --dev
      - name: Run protocol conformance suite
        run: pnpm conformance
      - name: Run ClickHouse integration tests
        run: pnpm --filter @hypequery/clickhouse test:integration
        env:
          CLICKHOUSE_TEST_HOST: http://localhost:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: hypequery_test
          CLICKHOUSE_TEST_DB: test_db
          NODE_OPTIONS: "--experimental-vm-modules --experimental-global-webcrypto --no-warnings"
      - name: Run Datasets unit and integration coverage gate
        run: pnpm --filter @hypequery/datasets test:coverage:full
        env:
          CLICKHOUSE_TEST_HOST: http://localhost:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: hypequery_test
          CLICKHOUSE_TEST_DB: test_db
          NODE_OPTIONS: "--experimental-vm-modules --experimental-global-webcrypto --no-warnings"
      - name: Run Serve semantic live integration tests
        run: pnpm --filter @hypequery/serve test:integration
        env:
          CLICKHOUSE_TEST_HOST: http://localhost:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: hypequery_test
          CLICKHOUSE_TEST_DB: test_db
          NODE_OPTIONS: "--experimental-vm-modules --experimental-global-webcrypto --no-warnings"
      - name: Run smoke tests
        run: pnpm smoke:consumers
  # Unit tests for the release scripts, and on PRs the rule that a changed
  # API report comes with a changeset declaring `Consumer-breaking:`.
  release-tooling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Test release and API report scripts
        run: node --test "scripts/release/**/*.test.mjs" "scripts/utils/api-report-entry-points.test.mjs"
      - name: Require Consumer-breaking declarations for public API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/release/check-api-changesets.mjs --base "origin/$BASE_REF"

  python-clients:
    uses: ./.github/workflows/python-clients.yml
    with:
      ref: ${{ github.sha }}

  # npm publishing uses trusted publishing (OIDC): no npm token. Each package
  # trusts hypequery/hypequery + ci.yml on npmjs.com; setup steps and failure
  # runbook are in release-commands.md ("Release guardrails").
  canary-release:
    needs: [build, python-clients]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      # `pnpm publish` (used by `changeset publish`) hands off to this npm.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          echo "npm $(npm --version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all hypequery packages
        run: pnpm turbo run build --filter='@hypequery/*'
      - name: Publish canary packages
        run: |
          cat <<'EOF' > .changeset/canary-release.md
          ---
          "@hypequery/agent": patch
          "@hypequery/clickhouse": patch
          "@hypequery/cloud-client": patch
          "@hypequery/datasets": patch
          "@hypequery/deployment": patch
          "@hypequery/serve": patch
          "@hypequery/cli": patch
          "@hypequery/mcp": patch
          "@hypequery/protocol": patch
          "@hypequery/protocol-conformance": patch
          "@hypequery/react": patch
          ---

          Temporary canary snapshot release.
          EOF

          cleanup() {
            git checkout -- \
              pnpm-lock.yaml \
              packages/agent/package.json \
              packages/clickhouse/package.json \
              packages/clickhouse/CHANGELOG.md \
              packages/cloud-client/package.json \
              packages/cloud-client/CHANGELOG.md \
              packages/datasets/package.json \
              packages/deployment/package.json \
              packages/deployment/CHANGELOG.md \
              packages/serve/package.json \
              packages/serve/CHANGELOG.md \
              packages/cli/package.json \
              packages/cli/CHANGELOG.md \
              packages/mcp-server/package.json \
              packages/mcp-server/CHANGELOG.md \
              packages/mcp-server/src/version.ts \
              packages/protocol/package.json \
              packages/protocol/CHANGELOG.md \
              packages/protocol-conformance/package.json \
              packages/protocol-conformance/CHANGELOG.md \
              packages/react/package.json \
              packages/react/CHANGELOG.md 2>/dev/null || true
            rm -f .changeset/canary-release.md
          }

          trap cleanup EXIT

          pnpm changeset version --snapshot canary
          # Record what this run publishes before the trap restores package.json:
          # the verify and failure-report steps read it.
          node scripts/release/list-publishable.mjs --prerelease canary --out "$RUNNER_TEMP/publish-expected.json"
          # No rebuild here: a package that bakes its own version into dist
          # regenerates it in `prepack`, which runs per package at publish time.
          # The stable release job has no equivalent step, so the hook has to
          # live in the package rather than in one workflow.
          pnpm changeset publish --tag canary
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Verify canaries resolve on npm
        run: node scripts/release/verify-npm-publish.mjs --packages-file "$RUNNER_TEMP/publish-expected.json"
      # The release-failure-alert job reads this to name the missing versions.
      - name: Keep the recorded versions for the failure report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-expected-canary-release
          path: ${{ runner.temp }}/publish-expected.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
  release:
    needs: [build, python-clients]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    outputs:
      # publishedPackages is a JSON list of { name, version } for this run.
      mcp_published: ${{ steps.changesets.outputs.published == 'true' && contains(steps.changesets.outputs.publishedPackages, '"@hypequery/mcp"') }}
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      # `pnpm publish` (used by `changeset publish`) hands off to this npm.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          echo "npm $(npm --version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all hypequery packages
        run: pnpm turbo run build --filter='@hypequery/*'
      # Versions on main that npm lacks: what `changeset publish` will attempt,
      # or what an earlier failed publish left behind. changesets/action does
      # not retry those while other changesets are queued, so they are
      # verified below either way.
      - name: Record unpublished versions
        run: node scripts/release/list-publishable.mjs --unpublished --out "$RUNNER_TEMP/publish-expected.json"
      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: without it changesets/action writes no .npmrc token
          # and npm authenticates with OIDC.
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Verify published packages resolve on npm
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/release/verify-npm-publish.mjs --packages-file "$RUNNER_TEMP/publish-expected.json" --packages-json "$PUBLISHED"
      # The release-failure-alert job reads this to name the missing versions.
      - name: Keep the recorded versions for the failure report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-expected-release
          path: ${{ runner.temp }}/publish-expected.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # One job reports both publish jobs' failures, so they never race each other
  # to create the issue. The concurrency group, shared with release-health.yml,
  # serializes reports across runs too. A run waiting in the group is cancelled
  # if a third one queues behind it; the daily staleness check still catches an
  # outage that loses its alert that way.
  release-failure-alert:
    needs: [canary-release, release]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.canary-release.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open or comment on the release-failure issue
    concurrency:
      group: release-failure-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      # A job that failed before recording its versions uploaded nothing; the
      # report then says so instead of listing versions.
      - name: Fetch the versions canary-release recorded
        if: needs.canary-release.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-expected-canary-release
          path: ${{ runner.temp }}/expected/canary-release
      - name: Fetch the versions release recorded
        if: needs.release.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-expected-release
          path: ${{ runner.temp }}/expected/release
      - name: Report canary-release
        if: needs.canary-release.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/report-release-failure.mjs --job canary-release --expected-file "$RUNNER_TEMP/expected/canary-release/publish-expected.json"
      - name: Report release
        if: needs.release.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED: ${{ needs.release.outputs.published_packages }}
        run: node scripts/release/report-release-failure.mjs --job release --expected-file "$RUNNER_TEMP/expected/release/publish-expected.json" --packages-json "$PUBLISHED"

  # A stable @hypequery/mcp release is also listed in the official MCP Registry.
  mcp-registry:
    needs: release
    if: needs.release.outputs.mcp_published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
