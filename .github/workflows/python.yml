name: Python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'specs/security-protocol/**'
      - 'specs/datasets/**'
      - 'packages/datasets/src/execution-capabilities.json'
      - 'specs/serve-http/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'specs/security-protocol/**'
      - 'specs/datasets/**'
      - 'packages/datasets/src/execution-capabilities.json'
      - 'specs/serve-http/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: python/hypequery

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      - run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      # RFC 0010: a value moves as a typed parameter, never as SQL text.
      - run: uv run python scripts/check_sql_interpolation.py
      - run: uv run pytest

  clickhouse-integration:
    name: clickhouse integration (${{ matrix.clickhouse-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clickhouse-version: ['25.8', '26.3']
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse-version }}
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: hypequery_test
          CLICKHOUSE_DB: test_db
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      - run: uv sync --all-extras --dev
      - name: Run datasets coverage with live ClickHouse
        run: |
          uv run coverage erase
          uv run coverage run -m pytest
          uv run coverage combine
          uv run coverage report
        env:
          HYPEQUERY_TEST_CLICKHOUSE_HOST: localhost
          HYPEQUERY_TEST_CLICKHOUSE_PASSWORD: hypequery_test

  minimal-install:
    # The framework-free promise is only meaningful when tested WITHOUT the
    # extras installed. This job is what proves `pip install hypequery` does
    # not drag in FastAPI or a ClickHouse driver.
    name: minimal install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      - run: uv sync --dev
      - run: uv run pytest tests/test_import_hygiene.py

  fastapi-floor:
    # The `fastapi` extra promises the declared floor, and FastAPI's routing
    # internals differ across releases in ways that decide whether a route is
    # authenticated. The serve tests run against the floor as well as the lock.
    name: serve on the FastAPI floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      - run: uv sync --all-extras --dev
      - run: uv pip install "fastapi==0.115.0" "starlette<0.39" "uvicorn==0.30.0"
      - run: uv run --no-sync pytest tests/test_serve_router.py tests/test_serve_security.py tests/test_serve_errors.py tests/test_serve_http_fixtures.py tests/test_serve_discovery.py tests/test_serve_endpoints.py tests/test_serve_semantic_fixtures.py tests/test_serve_production.py tests/test_serve_dev.py

  getting-started:
    # PYE-01 acceptance: the README's Getting started path, run as written from
    # a freshly built wheel, reaches a served dataset well inside 15 minutes.
    name: getting started walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: hypequery_test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      - run: uv build --wheel
      - run: uv run --no-project --python 3.12 python scripts/getting_started.py dist/hypequery-*.whl
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PASSWORD: hypequery_test

  build:
    # Acceptance criterion: published archives carry no local paths, secrets,
    # or stray monorepo files.
    name: build and audit artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Audit archive contents
        run: uv run python scripts/audit_artifacts.py dist

  conformance:
    # RFC 0012 gate: once Python announces a fixture family, that family must
    # remain byte- and error-code-identical to the shared protocol corpus.
    name: conformance (protocol + sql-portability families)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: python/hypequery/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project python/hypequery --dev
      - run: pnpm --filter @hypequery/serve... build
      - name: Run Python against the expected shared fixture families
        run: pnpm conformance:python
      - name: Run shared HTTP error and semantic fixtures in both languages
        run: pnpm conformance:serve
