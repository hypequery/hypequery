# ClickHouse for the hypequery examples seed dataset.
#
#   docker compose -f examples/_seed/docker-compose.yml up -d --wait
#   pnpm seed
#
# Pinned to an LTS tag so checksums and screenshots stay stable. Bump it on
# purpose, re-run `pnpm --filter @hypequery-examples/seed seed:write-checksums`,
# and update the "Tested on ClickHouse" line in the guides.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: hypequery-examples-clickhouse
    # Loopback only: the password below is public. Map "0.0.0.0:8123:8123" if
    # another machine must reach it, and change the password first.
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: hypequery
      CLICKHOUSE_DB: hypequery_examples
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: UTC
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
