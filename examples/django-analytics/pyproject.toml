[project]
name = "django-analytics"
version = "0.1.0"
description = "A Django project with its own ORM models, serving tenant-scoped ClickHouse analytics from hypequery datasets"
requires-python = ">=3.11"
dependencies = [
  "hypequery[django]>=0.1.0b3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
]

# Inside the hypequery monorepo the example runs against the workspace copy
# of the Python package, like the TypeScript examples use `workspace:*`.
# `hypequery create` and the nightly @latest run remove this table so the
# published PyPI release is installed instead.
[tool.uv.sources]
hypequery = { path = "../../python/hypequery", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
