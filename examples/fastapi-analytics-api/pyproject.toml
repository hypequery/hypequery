[project]
name = "fastapi-analytics-api"
version = "0.1.0"
description = "A FastAPI analytics API over ClickHouse: hypequery datasets served with tenant scoping, plus your own typed report routes"
requires-python = ">=3.11"
dependencies = [
  "hypequery[clickhouse,jwt]>=0.1.0b3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "pytest-asyncio>=0.24",
]

# Inside the hypequery monorepo the example runs against the workspace copy
# of the Python package, like the TypeScript examples use `workspace:*`.
# `hypequery create` and the nightly @latest run remove this table so the
# published PyPI release is installed instead.
[tool.uv.sources]
hypequery = { path = "../../python/hypequery", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
