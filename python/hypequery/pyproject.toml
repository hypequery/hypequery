[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hypequery"
version = "0.1.0b1"
description = "Type-safe ClickHouse semantic layer and serving for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hypequery" }]
keywords = ["clickhouse", "analytics", "semantic-layer", "datasets", "asgi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Django",
  "Framework :: AsyncIO",
  "Framework :: Flask",
  "Framework :: Pydantic :: 2",
  "Topic :: Database",
  "Typing :: Typed",
]

# Definition-only use must stay framework-free. Nothing here may pull in a web
# framework or a database driver; those are extras, enforced by importlinter.
# AnyIO is an async runtime, not a framework: the serving core runs sync host
# code on its worker threads, so `hypequery.serve` needs no extra at all.
# Floors are measured minimums: each is the oldest release that installs from
# wheels and passes the suite on its Python version. On Python 3.14,
# pydantic-core has no wheel before pydantic 2.12.0, 2.12.0 rejects
# MetricRequest's `None` field overrides and 2.12.1 is yanked, so 3.14 starts
# at 2.12.2. anyio 4.14.2 is the first release free of published advisories;
# clickhouse-connect 1.4.2 introduced named driver errors the executor maps to
# categories; urllib3 2.8.0 fixes three published advisories. Transitive floors
# close advisories the direct floors would still admit: h11 0.16.0 (via
# uvicorn), certifi 2026.10.19 (via clickhouse-connect) and idna 3.15 (via
# anyio and aiohttp). The integration extras start at the first releases free of
# published advisories (django 5.2.17, flask 3.1.3, werkzeug 3.1.9, pyarrow
# 23.0.1), and so do their transitive floors: sqlparse 0.6.0 (Django admits
# 0.3.1) and jinja2 3.1.6 (Flask admits 3.1.2); pandas 2.3.3 is the first with
# Python 3.14 wheels; polars 1.0.0 and asgiref 3.8.1 (Django 5.2's own floor)
# pass the suite.
# CI's floor jobs install exactly these.
dependencies = [
    "pydantic>=2.9.2; python_version < '3.14'",
    "pydantic>=2.12.2; python_version >= '3.14'",
    "tzdata>=2025.2",
    "anyio>=4.14.2",
    "idna>=3.15",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=1.4.2", "urllib3>=2.8.0", "certifi>=2026.10.19"]
clickhouse-async = [
    "clickhouse-connect[async]>=1.4.2",
    "aiohttp>=3.14.4",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "idna>=3.15",
]
# The uvicorn server behind `start_server` and `hypequery dev`. Serving an API
# from another ASGI server or framework needs no extra.
server = ["uvicorn>=0.30.6", "h11>=0.16.0"]

jwt = ["pyjwt[crypto]>=2.15.0", "cryptography>=50.0.0"]
pandas = ["pandas>=2.3.3"]
polars = ["polars>=1.0.0"]
arrow = ["pyarrow>=23.0.1"]
django = [
    "django>=5.2.17",
    "asgiref>=3.8.1",
    "sqlparse>=0.6.0",
    "clickhouse-connect>=1.4.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]
flask = [
    "flask[async]>=3.1.3",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
    "clickhouse-connect>=1.4.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]

[project.scripts]
hypequery = "hypequery.cli:main"

[project.urls]
Homepage = "https://hypequery.com"
Repository = "https://github.com/hypequery/hypequery"
Issues = "https://github.com/hypequery/hypequery/issues"
Documentation = "https://github.com/hypequery/hypequery/tree/main/python/hypequery#readme"
Changelog = "https://github.com/hypequery/hypequery/blob/main/python/hypequery/CHANGELOG.md"

[dependency-groups]
dev = [
  "coverage>=7.10",
  "hypothesis>=6.100",
  "pytest>=8.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.0",
  "httpx>=0.27",
  # Only a test oracle: its CORS and trusted-host middleware check the core's.
  # 1.10 is the release whose Vary and IPv6 Host handling the core matches.
  "starlette>=1.10",
  "packaging>=25",
  "towncrier==26.9.0",
  "sqlalchemy>=2.0",
  "flask-login>=0.6.3",
  "flask-wtf>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypequery"]

[tool.hatch.build.targets.sdist]
# A point-in-time review of an earlier PR; it describes no shipped behaviour.
# The rest is local state that .gitignore also lists, excluded here as well so
# a build from a working checkout cannot pick it up: coverage data (absolute
# paths from the machine that ran the tests), reports, env files and databases.
# scripts/audit_artifacts.py refuses an sdist that contains any of it.
exclude = [
  "TESTING_REVIEW.md",
  ".coverage",
  ".coverage.*",
  "coverage.json",
  "htmlcov",
  "reports",
  ".env",
  "*.sqlite3",
]

[tool.hatch.build]
# Include dotfiles used by the project template despite VCS ignore rules.
artifacts = ["src/hypequery/cli/templates/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # import sorting
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "A",             # builtin shadowing
  "C4",            # comprehensions
  "PT",            # pytest style
  "S",             # bandit — includes S608 hardcoded-SQL, a plan-level ban
  "RUF",
  "SIM",           # simplifications
  "RET",           # return hygiene
  "PIE",
  "PERF",
  "C90",           # mccabe complexity
]
# Ruff cannot see that a NoReturn raiser such as deployment_error() ends a
# function, so RET503 would demand unreachable returns.
ignore = ["RET503"]

[tool.ruff.lint.mccabe]
# New code stays under this. The validators exempted below mirror their
# TypeScript counterparts branch for branch and are pinned by conformance.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert and spawn subprocesses to check import hygiene.
"tests/**" = ["S101", "S603", "S404"]
"src/hypequery/protocol/deployments.py" = ["C901"]
"src/hypequery/protocol/values.py" = ["C901"]
"src/hypequery/datasets/utils/derived_measures.py" = ["C901"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "examples"]
# The scaffold templates import the generated project's own modules (datasets,
# analytics); tests/test_cli_init_framework.py imports and serves each one.
exclude = ["^src/hypequery/cli/templates/"]
warn_unreachable = true
# Public signatures must not leak Any; see the PR rules in the plan.
disallow_any_generics = true

# Optional integrations ship no usable types for Python 3.11 (Django, pandas and
# pyarrow have none; numpy's, reached through polars, need 3.12 syntax). Their
# objects type as Any at the integration boundary only.
[[tool.mypy.overrides]]
module = ["django.*", "flask_login.*", "flask_wtf.*", "pandas.*", "pyarrow.*", "numpy.*", "polars.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
branch = true
source = ["hypequery"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
# Per-package floors live in scripts/check_coverage.py; this is the overall floor.
fail_under = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# Import boundaries. These encode the layering the security roadmap requires:
# protocol is the foundation, datasets builds on it, execution adapts compiled
# queries to a driver, serve sits on top, and the CLI composes all of them.
# Neither protocol nor datasets may reach for a framework or a driver.
[tool.importlinter]
root_package = "hypequery"
# Required because the forbidden-module contract below names third-party
# packages rather than internal ones.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered: contrib -> cli -> serve -> execution -> datasets -> protocol"
type = "layers"
layers = [
  "hypequery.contrib",
  "hypequery.cli",
  "hypequery.serve",
  "hypequery.execution",
  "hypequery.datasets",
  "hypequery.protocol",
]

[[tool.importlinter.contracts]]
name = "protocol and datasets stay framework-free and driver-free"
type = "forbidden"
source_modules = ["hypequery.protocol", "hypequery.datasets"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "clickhouse_connect"]

# Decision 0023: the serving core takes requests from any framework's adapter
# and imports none of them. AnyIO (its worker pool) is a runtime, not a framework.
[[tool.importlinter.contracts]]
name = "The serve core stays framework-free"
type = "forbidden"
source_modules = ["hypequery.serve.core"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "uvicorn",
  "django",
  "flask",
  "werkzeug",
  "asgiref",
]

# Decision 0023: Django and Flask are served natively from contrib, through the
# same sync adapter as any WSGI server; `hypequery.serve` imports neither.
[[tool.importlinter.contracts]]
name = "Serve imports no web framework; Django and Flask adapters live in contrib"
type = "forbidden"
source_modules = ["hypequery.serve"]
forbidden_modules = ["fastapi", "starlette", "django", "flask", "werkzeug", "asgiref"]

[[tool.importlinter.contracts]]
name = "Dataset SQL compilation stays independent of client orchestration and execution"
type = "forbidden"
source_modules = [
  "hypequery.datasets.planner.compiler",
  "hypequery.datasets.planner.features",
  "hypequery.datasets.planner.query_node",
  "hypequery.datasets.planner.aggregates",
  "hypequery.datasets.planner.predicates",
  "hypequery.datasets.planner.operators",
  "hypequery.datasets.planner.dialects",
]
forbidden_modules = [
  "hypequery.datasets.client",
  "hypequery.datasets.cache",
  "hypequery.execution",
  "hypequery.serve",
]

# Existing fragments are Markdown bullet lists named pr-<number>.md.
[tool.towncrier]
name = "hypequery"
package = ""
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "changelog.d/template.md"
title_format = "## {version} ({project_date})"
start_string = "<!-- towncrier release notes start -->\n"
all_bullets = false
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "md"
name = "Changes"
showcontent = true
