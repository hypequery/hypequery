<svg xmlns="http://www.w3.org/2000/svg" width="32" height="36" viewBox="0 0 32 36" fill="none" role="img" aria-labelledby="compact-title">
  <title id="compact-title">hypequery logo mark</title>
  <style>
    .eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s 2s linear infinite;
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.12); }
    }
    .body { animation: bob-and-sit 2s ease-in-out both; }
    .legs {
      transform-origin: 16px 29px;
      animation: sit 2s ease-in-out both;
    }
    @keyframes bob-and-sit {
      0%, 25%, 50%, 70% { transform: translateY(-2px); }
      12.5%, 37.5% { transform: translateY(-3px); }
      90% { transform: translateY(.6px); }
      100% { transform: translateY(0); }
    }
    @keyframes sit {
      0%, 70% { transform: scaleY(1); }
      100% { transform: scaleY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eyes, .body, .legs { animation: none; }
      .legs { display: none; }
    }
  </style>
  <defs>
    <mask id="face" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="36" style="mask-type:luminance">
      <rect width="32" height="36" fill="white"/>
      <g class="eyes" fill="black">
        <rect x="14" y="20.5" width="3.5" height="5" rx="1.75"/>
        <rect x="23" y="20.5" width="3.5" height="5" rx="1.75"/>
      </g>
    </mask>
  </defs>
    <g class="legs" fill="#252b3a">
      <rect x="7" y="28" width="4" height="7" rx="2"/>
      <rect x="22" y="28" width="4" height="7" rx="2"/>
    </g>
    <g class="body">
  <path fill="#252b3a" mask="url(#face)" d="M5 17H11V13A3 3 0 0 1 14 10H21V6A3 3 0 0 1 24 3H27A3 3 0 0 1 30 6V30A3 3 0 0 1 27 33H5A3 3 0 0 1 2 30V20A3 3 0 0 1 5 17Z"/>
    </g>
</svg>
