<svg xmlns="http://www.w3.org/2000/svg" width="318" height="419" viewBox="26 11 318 419" fill="none" role="img" aria-labelledby="blink-title blink-desc">
  <title id="blink-title">hypequery logo mark</title>
  <desc id="blink-desc">An outlined rising-chart mascot with solid dark eyes that blink occasionally.</desc>
  <style>
    .blink-eyes {
      transform-box: view-box;
      transform-origin: 212px 224px;
      animation: hypequery-blink 5s linear infinite;
    }
    @keyframes hypequery-blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blink-eyes { animation: none; }
    }
  </style>
